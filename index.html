<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>TJA Chart Studio</title>
    <meta name="apple-mobile-web-app-title" content="TJACS" />
    <meta name="application-name" content="TJA Chart Studio" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <!-- 縦向きのときは #root ごと 90° 回転させて横画面で表示する（src/orient.ts） -->
    <div id="root">
    <div id="app">
      <div class="stage">
        <canvas id="editor"></canvas>
        <div id="tools" class="tools">
          <!-- ノーツ 4 つ（選んでいるボタンをもう一度タップすると、ドン⇔カッ・大ドン⇔大カッ・連打⇔大連打 が切り替わる） -->
          <div class="note-tools">
            <button data-group="small" class="tool" aria-label="ドン / カッ"><i></i></button>
            <button data-group="big" class="tool" aria-label="大ドン / 大カッ"><i></i></button>
            <button data-group="roll" class="tool" aria-label="連打 / 大連打"><i></i></button>
            <button data-group="balloon" class="tool" aria-label="風船"><i></i></button>
          </div>
          <!-- 命令: ゴーゴー（判定枠の炎の玉）、SCROLL・グラデ、BPMCHANGE、MEASURE -->
          <div class="cmd-tools">
            <button data-group="gogo" class="tool gogo" aria-label="ゴーゴータイム"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M24 9c6-3 9 1 13-2-1 6-2 11-6 17z" fill="#ee6e30"/>
              <circle cx="18" cy="22" r="14" fill="#f07436"/>
              <circle cx="18" cy="22" r="12" fill="none" stroke="#ffcf8a" stroke-width="1.2"/>
              <circle cx="18" cy="22" r="8" fill="#f3a35f" stroke="#ffe2a0" stroke-width="1.6"/>
            </svg></button>
            <button data-group="scroll" class="tool cmd scroll" aria-label="SCROLL・グラデ"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M4 13h9M2 20h11M4 27h9" stroke-width="2.4"/>
              <path d="M17 11l9 9-9 9M26 11l9 9-9 9" stroke-width="3.4"/>
            </svg></button>
            <button data-group="bpm" class="tool cmd bpm" aria-label="BPMCHANGE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M2 22h8l4-11 6 20 5-14 3 5h10" stroke-width="3"/>
            </svg></button>
            <button data-group="measure" class="tool cmd measure" aria-label="MEASURE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M7 4v32" stroke-width="2.6"/>
              <text x="24" y="18" text-anchor="middle">3</text>
              <text x="24" y="36" text-anchor="middle">4</text>
            </svg></button>
          </div>
        </div>
      </div>
      <!-- グリッドのメニュー（右のアイコンバーの少し左に出す） -->
      <div id="divMenu" class="div-menu hidden" role="menu"></div>
      <div id="flyMenu" class="div-menu fly-menu hidden" role="menu"></div>
      <nav class="side">
        <button id="btnHome" title="曲選択へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10H3z"/></svg></button>
        <button id="btnUndo" title="元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btnRedo" title="やり直し"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <!-- 2 段のメニュー: アイコンを押すと、左に項目の一覧が出る -->
        <button id="btnEdit" data-fly="edit" title="編集（譜面情報・TJA・BPM 測定）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
        <button id="btnFile" data-fly="file" title="読み込み・書き出し"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v12"/><path d="m4.5 11.5 3.5 3.5 3.5-3.5"/><path d="M16 21V9"/><path d="m12.5 12.5 3.5-3.5 3.5 3.5"/></svg></button>
        <button id="btnSound" data-fly="sound" title="メトロノーム・再生速度"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5z"/><path d="M12 16 18 6"/><path d="M7.5 15h9"/></svg><small id="rateLabel">1.0x</small></button>
        <button id="btnTest" data-fly="test" title="テストプレイ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <button id="btnSettings" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
        <button class="divbtn" id="btnDiv" title="グリッド（分割）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v20H8z"/><path d="M8 6h4M8 10h5M8 14h4M8 18h5"/></svg><small id="divLabel">1/4</small></button>
      </nav>
    </div>


    <!-- 最初の画面（曲選択）: 左にロゴ、右にフォルダと曲の一覧、右下に試聴（src/home/home.ts） -->
    <div id="home" class="home hidden">
      <div class="home-bg" aria-hidden="true">
        <svg class="hb-grid" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="hbGlow" cx="0.3" cy="0.5" r="0.55">
              <stop offset="0" stop-color="#0b5fc0" stop-opacity="0.38"/>
              <stop offset="0.55" stop-color="#06305e" stop-opacity="0.18"/>
              <stop offset="1" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
            <pattern id="hbHex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
              <path d="M28 0 56 16v32L28 64 0 48V16zM28 64v33" fill="none" stroke="#1e88ff" stroke-opacity="0.07" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="1600" height="900" fill="url(#hbHex)"/>
          <rect width="1600" height="900" fill="url(#hbGlow)"/>
          <!-- 斜めの帯 -->
          <path d="M-100 760 760 -40h120L20 760z" fill="#1e88ff" opacity="0.06"/>
          <path d="M980 900 1600 260v90L1080 900z" fill="#fff" opacity="0.035"/>
          <path d="M1180 900 1600 470v40l-380 390z" fill="#1e88ff" opacity="0.08"/>
          <path d="M0 640h520l40 -40h1040" fill="none" stroke="#1e88ff" stroke-opacity="0.35" stroke-width="1.2"/>
          <path d="M0 132h420l36 36h1144" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
          <circle cx="456" cy="168" r="4" fill="#fff" opacity="0.5"/>
          <circle cx="560" cy="600" r="4" fill="#1e88ff" opacity="0.9"/>
        </svg>
        <svg class="hb-rings" viewBox="0 0 600 600" aria-hidden="true">
          <circle cx="300" cy="300" r="290" fill="none" stroke="#1e88ff" stroke-opacity="0.18" stroke-width="1"/>
          <g class="hb-spin1"><circle cx="300" cy="300" r="262" fill="none" stroke="#1e88ff" stroke-opacity="0.45" stroke-width="6" stroke-dasharray="120 40 30 60 200 90" /></g>
          <g class="hb-spin2"><circle cx="300" cy="300" r="236" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 10" /></g>
          <g class="hb-spin3"><circle cx="300" cy="300" r="212" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="260 70 40 70 300 80" /></g>
          <circle cx="300" cy="300" r="190" fill="none" stroke="#1e88ff" stroke-opacity="0.25" stroke-width="1"/>
        </svg>
      </div>

      <header class="home-top">
        <div class="home-tools">
          <button data-h="import" title="読み込み（.tja / .zip）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5"/><path d="M9 12h11"/><path d="m16 8 4 4-4 4"/></svg></button>
          <button data-h="settings" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
          <button data-h="new" title="新しい譜面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
        </div>
        <div class="home-tab"><span>SONG SELECT</span><b>曲</b></div>
        <div class="home-tools right">
          <button data-h="folder" title="フォルダを作る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10H3z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button>
          <button data-h="sort" title="並べ替え"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h6"/></svg><small id="homeSort">更新順</small></button>
          <button data-h="search" title="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></button>
        </div>
      </header>

      <section class="home-left">
        <div class="home-emblem">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <filter id="heGlowW" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <polygon points="100,14 174,57 174,143 100,186 26,143 26,57" fill="none" stroke="#1e88ff" stroke-width="2" opacity="0.6"/>
            <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="#05101e" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
            <g filter="url(#heGlowW)">
              <circle cx="100" cy="100" r="44" fill="none" stroke="#fff" stroke-width="9"/>
              <path d="M100 56a44 44 0 0 1 44 44" fill="none" stroke="#1e88ff" stroke-width="9"/>
              <circle cx="100" cy="100" r="20" fill="#1e88ff"/>
              <circle cx="100" cy="100" r="9" fill="#fff"/>
            </g>
          </svg>
        </div>
        <div class="home-word"><span class="w">TJA</span><span class="b">CS</span></div>
        <div class="home-word-line"><i></i><i></i></div>
        <div class="home-tagline">TJA CHART STUDIO</div>
        <div class="home-side">
          <button data-h="root" title="フォルダの一覧"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10H3z"/></svg></button>
          <button data-h="recent" title="最近の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></button>
        </div>
        <div class="home-info"><span>SONGS</span><b id="homeCount">0</b></div>
      </section>

      <section class="home-list-wrap">
        <div class="home-path"><i></i><span id="homePath">すべてのフォルダ</span></div>
        <div id="homeSearch" class="home-search hidden"><input id="homeQuery" type="search" placeholder="曲名・アーティストで探す" autocomplete="off"></div>
        <div id="homeList" class="home-list"></div>
      </section>

      <footer class="home-player">
        <button data-h="prev" aria-label="前の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg></button>
        <button data-h="pp" aria-label="試聴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <button data-h="next" aria-label="次の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
      </footer>
    </div>

    <div id="sheet" class="sheet hidden">
      <div class="sheet-panel">
        <div class="sheet-head">
          <div class="sheet-title">
            <h2 id="sheetTitle"></h2>
            <button id="sheetBold" class="bold-toggle" aria-label="太字の切り替え" aria-pressed="false">B</button>
            <span id="sheetDiag" class="sheet-diag"></span>
          </div>
          <button id="sheetClose" class="icon" aria-label="閉じる">×</button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- iPhone では accept に .tja を書くと選べなくなるので拡張子の制限はしない -->
    <input type="file" id="fileOpen" multiple hidden />
    <input type="file" id="fileAudio" hidden />
    <input type="file" id="fileHit" multiple hidden />

    <div id="play" class="play hidden">
      <canvas id="game"></canvas>
      <button id="playPause" class="icon pause" aria-label="ポーズ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <div id="pauseMenu" class="pause-menu hidden">
        <div class="panel">
          <h2>ポーズ</h2>
          <button id="pauseResume" class="primary">つづける</button>
          <button id="pauseRestart">はじめから</button>
          <button id="pauseBack">エディタへ</button>
        </div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2>結果</h2>
        <dl></dl>
        <div class="calib hidden">
          <p class="note">いつも同じ向きにずれているときは、端末の音の遅れが原因です。判定調整に反映すると次から合います。</p>
          <button id="applyCalib"></button>
        </div>
        <div class="calib edgehint hidden">
          <p class="note"></p>
          <button id="growFace"></button>
        </div>
        <button id="copyLog" class="small">記録（ログ）をコピー</button>
        <div class="buttons">
          <button id="retry" class="primary">もう一度</button>
          <button id="back">エディタへ戻る</button>
        </div>
      </div>
    </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
