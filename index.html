<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet" />
    <title>Malody Web Editor</title>
  </head>
  <body>
    <!-- 縦向きのときは #root ごと 90° 回転させて横画面で表示する（src/orient.ts） -->
    <div id="root">
    <div id="app">
      <div class="stage">
        <canvas id="editor"></canvas>
        <div id="tools" class="tools">
          <!-- ノーツ 4 つ（選んでいるボタンをもう一度タップすると、ドン⇔カッ・大ドン⇔大カッ・連打⇔大連打 が切り替わる） -->
          <div class="note-tools">
            <button data-group="small" class="tool" aria-label="ドン / カッ"><i></i></button>
            <button data-group="big" class="tool" aria-label="大ドン / 大カッ"><i></i></button>
            <button data-group="roll" class="tool" aria-label="連打 / 大連打"><i></i></button>
            <button data-group="balloon" class="tool" aria-label="風船"><i></i></button>
          </div>
          <!-- 命令: ゴーゴー（判定枠の炎の玉）、SCROLL・グラデ、BPMCHANGE、MEASURE -->
          <div class="cmd-tools">
            <button data-group="gogo" class="tool gogo" aria-label="ゴーゴータイム"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M24 9c6-3 9 1 13-2-1 6-2 11-6 17z" fill="#ee6e30"/>
              <circle cx="18" cy="22" r="14" fill="#f07436"/>
              <circle cx="18" cy="22" r="12" fill="none" stroke="#ffcf8a" stroke-width="1.2"/>
              <circle cx="18" cy="22" r="8" fill="#f3a35f" stroke="#ffe2a0" stroke-width="1.6"/>
            </svg></button>
            <button data-group="scroll" class="tool cmd scroll" aria-label="SCROLL・グラデ"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M4 13h9M2 20h11M4 27h9" stroke-width="2.4"/>
              <path d="M17 11l9 9-9 9M26 11l9 9-9 9" stroke-width="3.4"/>
            </svg></button>
            <button data-group="bpm" class="tool cmd bpm" aria-label="BPMCHANGE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M2 22h8l4-11 6 20 5-14 3 5h10" stroke-width="3"/>
            </svg></button>
            <button data-group="measure" class="tool cmd measure" aria-label="MEASURE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M7 4v32" stroke-width="2.6"/>
              <text x="24" y="18" text-anchor="middle">3</text>
              <text x="24" y="36" text-anchor="middle">4</text>
            </svg></button>
          </div>
        </div>
      </div>
      <nav class="side">
        <button id="btnUndo" title="元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btnRedo" title="やり直し"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button id="btnMetro" title="メトロノーム"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5z"/><path d="M12 16 18 6"/><path d="M7.5 15h9"/></svg></button>
        <button id="btnTest" title="テストプレイ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18v10H3z"/><path d="m3 10 1.5-5.5 16 0L19 10"/><path d="m8 4.5 2 5.5M13.5 4.5l2 5.5"/></svg></button>
        <button id="btnFile" title="ファイル・保存"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></svg></button>
        <button id="btnInfo" title="譜面情報"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"/></svg></button>
        <button id="btnEvents" title="TJA テキスト"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4"/><path d="m10 11-2.5 2.5L10 16M14 11l2.5 2.5L14 16"/></svg></button>
        <button id="btnRate" title="再生速度"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="m12 17 4.5-5"/></svg><small>1.0x</small></button>
        <label class="divbtn" title="分割"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v20H8z"/><path d="M8 6h4M8 10h5M8 14h4M8 18h5"/></svg><small id="divLabel">1/4</small><select id="divisor"></select></label>
      </nav>
    </div>

    <div id="sheet" class="sheet hidden">
      <div class="sheet-panel">
        <div class="sheet-head">
          <div class="sheet-title">
            <h2 id="sheetTitle"></h2>
            <button id="sheetBold" class="bold-toggle" aria-label="太字の切り替え" aria-pressed="false">B</button>
            <span id="sheetDiag" class="sheet-diag"></span>
          </div>
          <button id="sheetClose" class="icon" aria-label="閉じる">×</button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- iPhone では accept に .tja を書くと選べなくなるので拡張子の制限はしない -->
    <input type="file" id="fileOpen" multiple hidden />
    <input type="file" id="fileAudio" hidden />
    <input type="file" id="fileHit" multiple hidden />

    <div id="play" class="play hidden">
      <canvas id="game"></canvas>
      <button id="playExit" class="icon exit" aria-label="テストプレイを終了">×</button>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2>結果</h2>
        <dl></dl>
        <div class="calib hidden">
          <p class="note">いつも同じ向きにずれているときは、端末の音の遅れが原因です。判定調整に反映すると次から合います。</p>
          <button id="applyCalib"></button>
        </div>
        <div class="calib edgehint hidden">
          <p class="note"></p>
          <button id="growFace"></button>
        </div>
        <button id="copyLog" class="small">記録（ログ）をコピー</button>
        <div class="buttons">
          <button id="retry" class="primary">もう一度</button>
          <button id="back">エディタへ戻る</button>
        </div>
      </div>
    </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
