# 調査用（一時的）: 公開サーバー（Piped・Invidious）が YouTube の音声を返すか確かめる
name: check-public
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          exec > >(tee result.txt) 2>&1
          V=YE7VzlLtp-4
          O="Origin: https://mikado420.github.io"
          for a in https://invidious.f5.si https://inv.nadeko.net https://invidious.nerdvpn.de https://yewtu.be https://invidious.privacyredirect.com https://iv.melmac.space https://invidious.materialio.us https://inv.tux.pizza; do
            echo "== $a"
            curl -s -m 15 -D h.txt -H "$O" "$a/api/v1/videos/$V?local=true" -o s.json; head -1 h.txt; grep -i "access-control-allow-origin" h.txt
            jq -r '[.adaptiveFormats[]? | select(.type|test("audio"))] | map(.itag+" "+.type+" "+(.clen//"")) | .[]' s.json 2>/dev/null | head -4
            u=$(jq -r '[.adaptiveFormats[]? | select(.type|test("audio/mp4"))][0].url // empty' s.json 2>/dev/null)
            echo "url: ${u:0:120}"
            [ -n "$u" ] && { case "$u" in /*) u="$a$u";; esac; curl -s -m 25 -D h2.txt -H "$O" "$u&range=0-99999" -o a.bin; cat h2.txt | head -12; ls -la a.bin; head -c 200 a.bin | strings | head -3; }
            echo "-- latest_version"
            curl -s -m 25 -L -D h3.txt -H "$O" "$a/latest_version?id=$V&itag=140&local=true" -r 0-99999 -o b.bin; grep -i "^HTTP\|access-control\|content-type\|content-length\|^location" h3.txt; ls -la b.bin
          done
          sleep 1
          mkdir o && cp result.txt o/ && cd o && git init -q -b x && git -c user.name=t -c user.email=t@t commit -qm r --allow-empty && git add -A && git -c user.name=t -c user.email=t@t commit -qm r && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/check-out
